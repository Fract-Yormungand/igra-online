; Какие механики включены. true — работает, false — выключено.
; В собранной игре файл можно править рядом с IgraOnline.exe без пересборки.
; Порядок и наличие механик задаёт реестр в scripts/core/features.gd.

[mechanics]

; добыча ресурсов: источники, инструменты
harvest=true
; машины: посадка, вождение, фары
vehicles=true
; смена дня и ночи: солнце, луна, цвета неба
day_night=true
; характеристики, здоровье, запас сил, окно статуса
stats=true
; мобы: кабаны в лесу, слаймы у камней, паук в шахте
mobs=true